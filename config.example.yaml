# OWASP TEA conformance suite — example configuration.
#
# Copy to config.yaml and edit. The two levels below are deliberate: the global
# block is the default for every provider, and each provider says only what is
# different about it.
#
#   just plan      show what this file resolves to, without making any request
#   just run       run every provider
#   just run NAME  run one

version: 1

# Where each specification is fetched from. Every run fetches them afresh and
# writes the exact bytes it used into its own output directory, so a report is
# always checkable against the document it judged by. Override `ref` to pin a
# tag or a commit instead of tracking a branch.
specs:
  consumer:
    repo: CycloneDX/transparency-exchange-api
    ref: main
    path: spec/openapi.yaml
  publisher:
    # Upstream publishes this at version 0.0.2, describing products, *leaves*
    # and collections — an older TEA generation than the 0.4.0 consumption
    # document beside it, and one no current server implements. The suite has a
    # round-trip for it and reports the mismatch rather than failing a provider
    # over it.
    #
    # To exercise the publication model that matches 0.4.0, point this at the
    # proposed overlay instead:
    #
    #   repo: 0x73746F66/transparency-exchange-api
    #   ref: main
    #   path: spec/publisher/openapi.yaml
    #   note: the publication overlay proposed for the 0.4.x object model
    repo: CycloneDX/transparency-exchange-api
    ref: main
    path: spec/publisher/openapi.json
  wellKnown:
    repo: CycloneDX/transparency-exchange-api
    ref: main
    path: discovery/tea-well-known.schema.json
  insights:
    # The Insights specification is not yet part of the upstream repository.
    # This is the branch it is proposed from; the note appears in every report
    # so nobody mistakes it for a merged document.
    repo: 0x73746F66/transparency-exchange-api
    ref: insights
    path: insights/openapi.json
    note: >-
      not yet upstream — proposed in CycloneDX/transparency-exchange-api and
      fetched here from the proposing fork
  spdx:
    repo: spdx/license-list-data
    ref: main
    path: json/licenses.json

output:
  dir: reports
  # One Markdown file per area, plus an index. Set false for a single document.
  splitByArea: true
  # Keep every response body. Turning this off makes the run unreproducible,
  # and the report says so.
  retainResponses: true

# The areas to run, in the order they are listed in the README. Remove one here
# to drop it for every provider, or use each provider's own `exclude`.
areas:
  - discovery
  - consumer
  - purl
  - cyclonedx
  - spdx
  - insights
  - cel
  - provenance
  - performance
  - provider

# Areas excluded for every provider.
exclude: []

performance:
  # Requests per shape on a connection that has never been used. This is what a
  # consumer's first contact actually costs.
  coldSamples: 5
  # Warm replays per shape.
  iterations: 300
  # In-flight requests during the warm replay.
  concurrency: 32

# The records the `provider` area creates. They are deterministic on purpose: a
# re-run addresses the same objects, so the round-trip's delete cases clean up
# both this run and anything an interrupted earlier run left behind. Change
# runKey only if you need two suites writing to one catalogue at once.
writeCycle:
  namePrefix: owasp-tea-conformance
  runKey: conformance-001
  purlNamespace: pkg:generic/owasp-tea-conformance

providers:
  - name: vulnetix
    # Discovery starts here: DNS, then https://<dns>/.well-known/tea, then the
    # endpoint and version that document advertises.
    dns: vulnetix.com
    auth:
      # `header` sends the credential verbatim as the Authorization header,
      # for a value that arrives already rendered — from a vendor CLI, a
      # credential helper or a token broker. Splitting it apart so the suite
      # can rejoin it is a chance to get it wrong, and getting it wrong is a
      # 401 that reads as the provider's failure.
      #
      # Use `apikey`, `bearer` or `basic` where you hold the bare secret.
      scheme: header
      # Only the variable name lives in this file. Never the credential.
      credentialEnv: TEA_VULNETIX_CREDENTIAL

  # A second provider, showing the per-provider overrides. Uncomment and edit.
  #
  # - name: example
  #   dns: products.example.com
  #   auth:
  #     scheme: bearer
  #     credentialEnv: TEA_EXAMPLE_TOKEN
  #   # This provider serves a read-only mirror, so skip the write round-trip.
  #   exclude: [provider]
  #   output:
  #     dir: reports/example
  #     splitByArea: false
  #   # A shorter measurement against a provider you do not own.
  #   performance:
  #     iterations: 50
  #     concurrency: 8
  #   # Ask this provider about a different package set.
  #   packages:
  #     - pkg:npm/lodash
  #     - pkg:pypi/requests
  #
  # A provider that publishes no discovery document can be addressed directly:
  #
  # - name: staging
  #   dns: staging.example.com
  #   rootUrl: https://staging.example.com/tea/v1
  #   version: "0.4.0"
  #   insightsUrl: https://staging.example.com/insights

# The open-source sample every provider is asked about, as package URLs.
#
# This is the same 300-project set used for the original TEA conformance
# testing, so results stay comparable across runs and across providers. No
# provider is required to publish any of it: what the sample establishes is how
# much of a known set a catalogue actually covers.
